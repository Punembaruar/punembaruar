<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyr — PunëMbaruar</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="topbar"><a class="brand" href="/">Punë<span>Mbaruar</span></a></header>
<main class="section auth-wrap"><form id="loginForm" class="form-card auth-card"><span class="eyebrow">Hyrje pa password</span><h1>Hyr me telefon</h1><p class="muted-text">Vendos numrin. Në këtë version testues kodi OTP shfaqet në ekran; në production dërgohet me SMS.</p><label>Emri <small>(vetëm nëse je klient i ri)</small></label><input id="loginName" placeholder="Emri"><label>Telefoni</label><input id="loginPhone" required placeholder="+355 6X XXX XXXX"><button type="button" id="sendOtp" class="btn btn-secondary full">Merr kodin OTP</button><div id="otpArea" class="hidden"><label>Kodi OTP</label><input id="loginCode" inputmode="numeric" maxlength="6"><div id="devOtp" class="result-box"></div><button class="btn btn-primary btn-large full">Hyr në PunëMbaruar</button></div><div id="loginResult" class="result-box hidden"></div></form></main><div id="toast" class="toast"></div><script src="/static/app.js"></script></body></html>
