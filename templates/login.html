<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hyr — PunëMbaruar</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="/">Punë<span>Mbaruar</span></a>
</header>

<main class="section auth-wrap">

  <form id="pinLoginForm" class="form-card auth-card">

    <span class="eyebrow">HYRJE BIZNESI</span>

    <h1>Hyr në llogarinë e biznesit</h1>

    <p class="muted-text">
      Vendos numrin e telefonit dhe PIN-in 6-shifror të biznesit.
    </p>

    <label>Telefoni</label>
    <input
      id="pinLoginPhone"
      required
      placeholder="+355 6X XXX XXXX"
      autocomplete="tel"
    >

    <label>PIN 6-shifror</label>
    <input
      id="pinLoginPin"
      required
      type="password"
      inputmode="numeric"
      maxlength="6"
      minlength="6"
      pattern="[0-9]{6}"
      placeholder="••••••"
      autocomplete="current-password"
    >

    <button class="btn btn-primary btn-large full">
      Hyr në PunëMbaruar
    </button>

    <div id="pinLoginResult" class="result-box hidden"></div>

    <p class="muted-text" style="margin-top:18px">
      Nuk ke biznes të regjistruar?
      <a href="/#professionals">Regjistro biznesin nga faqja kryesore</a>
    </p>

  </form>

</main>

<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>

</body>
</html>
